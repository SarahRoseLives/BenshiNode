# Example VR-N76 simplex node configuration.
# Copy this file to BenshiNode.ini and set RADIO/MAC to your radio.

[RADIO]
MAC=AA:BB:CC:DD:EE:FF
DUAL_WATCH=0
# CHANNEL=30
APRS=0
# FREQUENCY=145.100
RX_CTCSS=0
TX_CTCSS=0
STATUS_POLL_MS=500
CONNECT_RETRY_MS=5000
SBC_BITPOOL=18
TX_LEAD_MS=100

[NODE]
CALLSIGN=N0CALL
DTMF_PREFIX=
DTMF_SUFFIX=#
PARROT_MODE=dtmf
PARROT_MAX_SEC=60
PARROT_DELAY_MS=800
ID_INTERVAL_SEC=600
ID_MIN_GAP_SEC=120
CW_WPM=20
CW_TONE_HZ=700
WAV_DIR=clips
COURTESY_TONE=0
TX_TIMEOUT_SEC=180
TX_LEAD_SILENCE_MS=100
TX_TAIL_SILENCE_MS=200
SQUELCH_MODE=auto
VOX_THRESHOLD_DB=-38
VOX_HANG_MS=600
RX_GAIN_DB=0
TX_GAIN_DB=0
LOG_LEVEL=info
LOG_FILE=BenshiNode.log

[PIPER]
# Optional female Piper voice for spoken help, identification, and prompts.
# Download the runtime and en_US-lessac-medium model with tools\install-piper.ps1.
# Generated WAVs are cached, so the first startup is slower.
ENABLED=0
EXE=tools\piper\piper.exe
MODEL=tools\piper\voices\en_US-lessac-medium.onnx
CACHE_DIR=tts-cache
LENGTH_SCALE=1.0
SENTENCE_SILENCE=0.05
SPELL_CALLSIGN=1
STARTUP_PROMPT=0
TIMEOUT_MS=30000
# HELP_TEXT=Custom help text read by Piper.
# STARTUP_TEXT=BenshiNode ready.

[DTMF]
0=HELP
1=PARROT
3=IDENT
4=ECHOLINK
5=UNLINK
6=DISCORD
7=DISCORD_LEAVE
9=RESET

[SERVER]
PORT=7300
AUDIO_PORT=7301
# Shared authentication key (audio is not encrypted).
KEY=change-me
MAX_CLIENTS=16

[LINK]
ENABLED=0
SERVER=your.server.example:7300
# Shared authentication key (audio is not encrypted).
KEY=change-me

[ECHOLINK]
ENABLED=0
DTMF=0
DTMF_PREFIX=4
CALLSIGN=YOURCALL
PASSWORD=
NAME=YOUR NAME
INFO=BenshiNode
# Set this to your default EchoLink node ID.
NODE=
# IP=203.0.113.10
DIRECTORY=servers.echolink.org:5200
PORT_BASE=5198


[DISCORD]
# Create a bot at https://discord.com/developers/applications and invite it
# with Connect and Speak permissions for the target voice channel.
# ENABLED=1 joins on startup; DTMF=1 enables keypad 6# (join) and 7# (leave).
# Keep the bot token in the ignored BenshiNode.ini, never in a tracked file.
ENABLED=0
DTMF=0
TOKEN=
GUILD_ID=
CHANNEL_ID=