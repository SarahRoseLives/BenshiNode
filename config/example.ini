# Example VR-N76 simplex node configuration.
# Copy this file to BenshiNode.ini and set RADIO/MAC to your radio.

[RADIO]
MAC=AA:BB:CC:DD:EE:FF
DUAL_WATCH=0
CHANNEL=30
APRS=0
# FREQUENCY=145.100
RX_CTCSS=0
TX_CTCSS=0
STATUS_POLL_MS=500
CONNECT_RETRY_MS=5000
SBC_BITPOOL=18
TX_LEAD_MS=100

[NODE]
CALLSIGN=K8SDR
DTMF_PREFIX=*
DTMF_SUFFIX=#
PARROT_MODE=dtmf
PARROT_MAX_SEC=60
PARROT_DELAY_MS=800
ID_INTERVAL_SEC=600
ID_MIN_GAP_SEC=120
CW_WPM=20
CW_TONE_HZ=700
WAV_DIR=clips
COURTESY_TONE=0
TX_TIMEOUT_SEC=180
TX_LEAD_SILENCE_MS=100
TX_TAIL_SILENCE_MS=200
SQUELCH_MODE=auto
VOX_THRESHOLD_DB=-38
VOX_HANG_MS=600
RX_GAIN_DB=0
TX_GAIN_DB=0
LOG_LEVEL=info
LOG_FILE=BenshiNode.log

[DTMF]
*1=PARROT
*2=HELP
*3=IDENT
*0=RESET
*4=ECHOLINK
*5=UNLINK

[SERVER]
PORT=7300
AUDIO_PORT=7301
# Shared authentication key (audio is not encrypted).
KEY=change-me
MAX_CLIENTS=16

[LINK]
ENABLED=0
SERVER=your.server.example:7300
# Shared authentication key (audio is not encrypted).
KEY=change-me

[ECHOLINK]
ENABLED=0
DTMF=0
DTMF_PREFIX=*4
CALLSIGN=YOURCALL
PASSWORD=
NAME=YOUR NAME
INFO=BenshiNode
# Set this to your default EchoLink node ID.
NODE=
# IP=203.0.113.10
DIRECTORY=servers.echolink.org:5200
PORT_BASE=5198
