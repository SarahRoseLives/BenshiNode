# Minimal BenshiNode reflector server configuration.
# Run: BenshiNode.exe --config config\server.ini --server
# Only TCP PORT and UDP AUDIO_PORT need to be reachable from clients.

[SERVER]
PORT=7300
AUDIO_PORT=7301
# Shared authentication key (not audio encryption).
KEY=use-a-long-random-shared-key
MAX_CLIENTS=16

[NODE]
LOG_LEVEL=info
LOG_FILE=BenshiNode-server.log
