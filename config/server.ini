# Example BenshiNode reflector server configuration.
#
# This file is for benshinode-server. Copy it to server.ini and edit the
# shared key before running. It is separate from the node application's
# BenshiNode.ini.
#
# Run the Go server from the repository root:
#   .\build\Release\benshinode-server.exe
#
# The legacy C++ server can still use this file:
#   BenshiNode.exe --config config\server.ini --server
#
# Only TCP PORT and UDP AUDIO_PORT need to be reachable from clients.

[SERVER]
PORT=7300
AUDIO_PORT=7301
# Shared authentication key (not audio encryption). Use a long random value.
KEY=use-a-long-random-shared-key
MAX_CLIENTS=16

# Optional web dashboard and live audio listener. Enable with ENABLED=1 or
# start the Go server with: benshinode-server --web :8080
# Keep BIND on 127.0.0.1 unless the dashboard should be reachable remotely.
[WEB]
ENABLED=0
BIND=127.0.0.1
PORT=8080

# Go server logging.
[LOG]
LEVEL=info
FILE=BenshiNode-reflector.log

# Legacy C++ server logging (ignored by benshinode-server).
[NODE]
LOG_LEVEL=info
LOG_FILE=BenshiNode-server.log
